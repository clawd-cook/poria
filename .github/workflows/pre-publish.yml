name: Pre-Publish (Beta)

on:
  push:
    tags:
      - "v*-beta*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.20.0"
  PNPM_VERSION: "11.23.0"

jobs:
  validate:
    name: Validate beta tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract and validate version
        id: extract
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Strip leading 'v'
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Validate format: X.Y.Z-beta.N
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; then
            echo "::error::Invalid beta tag format: $TAG (expected vX.Y.Z-beta.N)"
            exit 1
          fi

          echo "✅ Valid beta tag: $TAG (version: $VERSION)"

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: rust-${{ matrix.target }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-${{ matrix.target }}-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Sync version to build configs
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd apps/desktop

          # Update tauri.conf.json
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "

          # Update Cargo.toml version
          sed -i '' "s/^version = \".*\"/version = \"${VERSION}\"/" src-tauri/Cargo.toml

          # Update package.json version
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          echo "✅ Version synced to $VERSION"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: apps/desktop
        run: npx tsc -b --noEmit

      - name: Setup macOS signing
        if: env.SKIP_SIGNING != 'true' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "✅ macOS signing keychain configured"

      - name: Build Tauri app
        working-directory: apps/desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          cargo tauri build --target ${{ matrix.target }}

      - name: Ad-hoc sign app bundle (when no Apple certificate)
        if: secrets.APPLE_CERTIFICATE == ''
        env:
          TARGET: ${{ matrix.target }}
        run: |
          APP_PATH=$(find "apps/desktop/src-tauri/target/$TARGET/release/bundle/macos" -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Ad-hoc signing: $APP_PATH"
            codesign --force --deep -s - "$APP_PATH"
            codesign --verify --verbose "$APP_PATH" && echo "✅ Ad-hoc signature verified"
          fi

      - name: Rename artifacts
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          BUNDLE_DIR="apps/desktop/src-tauri/target/$TARGET/release/bundle"
          OUTPUT_DIR="$RUNNER_TEMP/artifacts"
          mkdir -p "$OUTPUT_DIR"

          # Find and rename .dmg
          DMG=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" -type f | head -1)
          if [ -n "$DMG" ]; then
            cp "$DMG" "$OUTPUT_DIR/Poria-${VERSION}-${ARCH}.dmg"
            echo "✅ DMG: Poria-${VERSION}-${ARCH}.dmg ($(du -h "$DMG" | cut -f1))"
          else
            echo "::error::No .dmg found in $BUNDLE_DIR/dmg/"
            exit 1
          fi

          # Verify artifact is not empty/corrupt
          DMG_SIZE=$(stat -f%z "$OUTPUT_DIR/Poria-${VERSION}-${ARCH}.dmg")
          if [ "$DMG_SIZE" -lt 1048576 ]; then
            echo "::error::DMG is suspiciously small (${DMG_SIZE} bytes)"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: poria-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/artifacts/Poria-*.dmg
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [validate, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "📦 Release artifacts:"
          ls -lh artifacts/
          echo ""
          echo "Checksums:"
          shasum -a 256 artifacts/*.dmg

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          cat > release-notes.md << 'NOTES'
          ## Poria Desktop ${{ needs.validate.outputs.version }} (Beta)

          > ⚠️ 这是预发布版本，仅供测试。

          ### 下载

          | 平台 | 架构 | 文件 |
          |------|------|------|
          | macOS | Apple Silicon (M1/M2/M3) | `Poria-${{ needs.validate.outputs.version }}-aarch64.dmg` |
          | macOS | Intel | `Poria-${{ needs.validate.outputs.version }}-x64.dmg` |

          ### 安装

          1. 下载对应架构的 `.dmg` 文件
          2. 双击打开，将 Poria 拖入 Applications 文件夹
          3. **首次打开前**，在终端执行以下命令移除隔离标记：
             ```bash
             xattr -cr /Applications/Poria.app
             ```
          4. 双击打开 Poria

          > ⚠️ Beta 版本未经 Apple 公证，macOS 会提示"已损坏"。
          > 执行上面的 `xattr -cr` 命令即可正常打开。
          > 正式版本将包含完整签名和公证。

          ### SHA-256 校验
          ```
          NOTES

          shasum -a 256 artifacts/*.dmg >> release-notes.md

          echo '```' >> release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "$TAG" \
            --title "Poria Desktop $VERSION (Beta)" \
            --notes-file release-notes.md \
            --prerelease \
            artifacts/*.dmg

          echo "✅ Release created: $(gh release view "$TAG" --json url -q .url)"
