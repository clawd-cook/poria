# Weekly version PRs. Do not let Dependabot bump Node or pnpm pins
# (package.json packageManager / CI env) without a human review of AGENTS.md.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
