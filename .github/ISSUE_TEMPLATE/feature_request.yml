name: 功能建议
description: 建议新能力或改进现有流水线 / 桌面端
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        较大改动请先开 Issue 再写代码。实现时不要反转 crate 依赖，也不要在 `submodules/` 里改代码。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在缺什么，或哪条路径用起来别扭？
      placeholder: 例如：部署阶段 EasyCI 绑定失败时，看板上只看到一句错误，不容易判断是没 push 还是 SELECT 写错。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望产品怎么表现。若已有分层想法（core / channels / skills / 前端）可以写上，不确定就留空技术细节。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代
    validations:
      required: false

  - type: dropdown
    id: layer
    attributes:
      label: 主要落点
      description: 可多选。跨层字段（需求筛选、backendTrdUrl、前后端 TRD）请在方案里写清。
      multiple: true
      options:
        - 桌面 UI（src/）
        - Tauri IPC（src-tauri/）
        - 领域 / 状态机（poria-core）
        - 流水线编排（poria-commands）
        - Skill 阶段（poria-skills）
        - 外部系统（poria-channels）
        - Agent / worktree（poria-resources）
        - 鉴权 / SQLite（poria-infrastructure）
        - 文档 / CI
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 有了更好
        - 重要
        - 卡住我当前的工作
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充
      description: 行云需求编号、JoySpace 链接、截图等。不要贴 Cookie。
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与
      options:
        - label: 我愿意帮忙实现
          required: false
        - label: 我已读过 CONTRIBUTING.md 里的分层约定
          required: false
