[package]
name = "poria-desktop"
version = "0.1.0"
description = "Poria AINative Delivery Platform"
authors = ["heyongqi10"]
edition = "2021"

[lib]
name = "poria_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
poria-core = { path = "../crates/poria-core" }
poria-infrastructure = { path = "../crates/poria-infrastructure" }
poria-commands = { path = "../crates/poria-commands" }
poria-resources = { path = "../crates/poria-resources" }
poria-skills = { path = "../crates/poria-skills" }
poria-channels = { path = "../crates/poria-channels" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rand = "0.9"
hex = "0.4"
urlencoding = "2"
url = "2"
